name: Bug report
description: Something in bun.ink is broken or behaves unexpectedly
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security problems or data leaks here — write to [info@bun.ink](mailto:info@bun.ink) instead.

        Never paste passphrases, recovery keys or GitHub tokens into an issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Opened a document on a branch
        2. Clicked Save
        3. Expected ... but ...
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: Does it happen every time?
      placeholder: Every time / sometimes / happened once
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of bun.ink?
      options:
        - Editor and writing
        - GitHub integration
        - Privacy and encryption
        - Mobile
        - Billing and account
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: e.g. Firefox 141 on Windows 11, Safari on iOS 18
    validations:
      required: true
